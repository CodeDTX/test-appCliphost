<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NETSTap</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #FF1F46 0%, #0753DE 100%);
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      max-width: 360px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .logo { font-size: 32px; font-weight: 700; color: #EA0029; margin-bottom: 4px; }
    .tagline { font-size: 14px; color: #6C7278; margin-bottom: 24px; }
    .description { font-size: 15px; color: #111; line-height: 1.6; margin-bottom: 24px; }
    .badge {
      display: inline-block;
      background: #f0f4ff;
      color: #003DA6;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">NETSTap</div>
    <div class="tagline">Tap. Select. Pay.</div>
    <div class="description">
      Tap an NFC tag at a merchant terminal to instantly select your preferred wallet and pay — no app installation required.
    </div>
    <span class="badge">Powered by App Clip</span>
  </div>
</body>
</html>
